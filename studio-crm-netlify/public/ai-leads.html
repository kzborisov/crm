<!doctype html><html lang="bg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI потенциални клиенти · Studio CRM</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ai-leads.css"></head><body><main class="ai-shell"><a class="text-link" href="/#/">← Studio CRM</a><header class="page-heading"><div><span class="eyebrow">AI SALES AGENT</span><h1>Потенциални клиенти<span class="accent-dot">.</span></h1><p>Нови бизнес възможности, подготвени за теб.</p></div><button id="generate" class="button secondary">＋ Намери чрез API</button></header><p id="status" role="status"></p><section class="panel ai-settings"><h2>Импорт от ChatGPT</h2><p>Качи JSON файла от дневния отчет или постави JSON текста. Не е необходим API ключ. Повторенията и записите под минималната оценка се пропускат.</p><div class="ai-fields"><label>JSON файл<input id="import-file" type="file" accept=".json,application/json"></label><label>Или постави JSON<textarea id="import-text" rows="5" placeholder='{"leads": [...] }'></textarea></label></div><button class="button primary" id="import-submit">Импортирай клиенти</button><p id="import-status" role="status"></p></section><section class="panel ai-settings"><h2>Настройки на агента</h2><form id="settings"><label><input type="checkbox" name="enabled"> Автоматично платено API търсене в работни дни</label><div class="ai-fields"><label>Брой клиенти<input type="number" name="count" min="1" max="10" required></label><label>Минимална оценка<input type="number" name="minScore" min="1" max="10" required></label><label>Час (България)<input type="number" name="hour" min="0" max="23" required></label><label>Райони<input name="locations" maxlength="400" required></label><label>Индустрии<textarea name="industries" maxlength="500" required></textarea></label></div><button class="button secondary" type="submit">Запази настройки</button></form></section><section class="panel ai-results"><div class="ai-toolbar"><h2>Намерени бизнеси</h2><select id="filter" aria-label="Статус"><option value="new">Нови</option><option value="approved">Одобрени</option><option value="contacted">Контактувани</option><option value="rejected">Отказани</option><option value="all">Всички</option></select><button class="button secondary" id="refresh">Обнови</button></div><div id="leads"></div></section></main><script type="module" src="/ai-leads.js"></script></body></html>
